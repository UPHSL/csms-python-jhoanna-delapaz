[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uphsl-csms-python"
version = "1.0.0"
description = "Python and Flask implementation of the Community Services Management System"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "UPHSL Programming Languages Laboratory" }
]
dependencies = [
    "Flask>=3.1,<4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "coverage>=7,<8"
]

[project.scripts]
csms = "csms.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csms = [
    "templates/*.html",
    "static/css/*.css"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["csms"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true